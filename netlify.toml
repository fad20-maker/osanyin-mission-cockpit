[build]
  publish = "site"
  command = ""
  # Ne republie le site que si l'interface change (dossier site/ ou ce fichier).
  # Les données sont servies depuis la branche « donnees » et ne déclenchent aucune publication.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
